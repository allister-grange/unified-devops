### REDDIS ###
- name: install Redis
  ansible.builtin.apt:
    name: redis-server
    state: present
    update_cache: yes

- name: ensure Redis is running and enabled
  ansible.builtin.service:
    name: redis-server
    state: started
    enabled: yes

### POSTGRES ###
- name: Add PostgreSQL APT repository key
  ansible.builtin.apt_key:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present

- name: Add PostgreSQL repository
  ansible.builtin.apt_repository:
    repo: "deb http://apt.postgresql.org/pub/repos/apt {{ ansible_distribution_release }}-pgdg main"
    state: present
    filename: pgdg

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install PostgreSQL 18
  ansible.builtin.apt:
    name: postgresql-18
    state: present

- name: Find the path of pg_hba.conf
  ansible.builtin.command: sudo -u postgres psql -tAc "SHOW hba_file;"
  register: hba_file
  changed_when: false

- name: Save and authorise the local connections
  ansible.builtin.lineinfile:
    path: "{{ hba_file.stdout | trim }}"
    regexp: '^local\s+all\s+all\s+peer\s*$'
    line: "local   all             all                                     trust"
    backup: yes

- name: Authorise postgres user in local connections
  ansible.builtin.lineinfile:
    path: "{{ hba_file.stdout | trim }}"
    regexp: '^local\s+all\s+postgres\s+peer$'
    line: "local   all             postgres                                trust"
    backup: yes

- name: Fetch the IP addresses of the server (used for configuring listen_addresses in postgresql.conf)
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Configurer listen_addresses in postgresql.conf
  ansible.builtin.lineinfile:
    path: /etc/postgresql/18/main/postgresql.conf
    regexp: '^#?\s*listen_addresses\s*='
    line: "listen_addresses = 'localhost,{{ ansible_facts['default_ipv4']['address'] }}'"
    backup: true

- name: Configurer data_directory in postgresql.conf
  ansible.builtin.lineinfile:
    path: /etc/postgresql/18/main/postgresql.conf
    regexp: '^#?\s*data_directory\s*='
    line: "data_directory = '/mnt/volume_missinglink_db/main'"
    backup: true

- name: Restart PostgreSQL after configuration changes
  ansible.builtin.service:
    name: postgresql
    state: restarted

# this is disabled in all productions that aren't 'prod' in
- name: set up the cronjob to run the db backup once every 6 hours
  ansible.builtin.cron:
    name: "backing up dbs every 6 hours"
    hour: "*/6"
    job: "sh {{ backup_script_dest_path }}/backup_db.sh"
    user: "root"
