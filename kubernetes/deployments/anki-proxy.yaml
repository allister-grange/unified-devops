apiVersion: apps/v1
kind: Deployment
metadata:
  name: anki-proxy-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anki-proxy
  template:
    metadata:
      labels:
        app: anki-proxy
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: auth
              mountPath: /etc/nginx/auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 15
          resources:
            requests:
              cpu: "10m"
              memory: "32Mi"
            limits:
              memory: "128Mi"
      volumes:
        - name: config
          configMap:
            name: anki-proxy-config
            items:
              - key: default.conf
                path: default.conf
        - name: auth
          secret:
            secretName: anki-proxy-auth
