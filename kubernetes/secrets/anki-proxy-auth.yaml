apiVersion: v1
kind: Secret
metadata:
  name: anki-proxy-auth
type: Opaque
stringData:
  # Apache htpasswd file used by nginx auth_basic. The committed value is a
  # PLACEHOLDER - either edit the hash below or (preferred) create the secret
  # out-of-band so no real credential lands in git:
  #
  #   htpasswd -cB ./htpasswd anki          # prompts for a password
  #   kubectl create secret generic anki-proxy-auth \
  #     --from-file=.htpasswd=./htpasswd \
  #     --dry-run=client -o yaml | kubectl apply -f -
  #
  # Callers then send:  curl -u anki:<password> ...
  .htpasswd: |
    anki:$apr1$REPLACED$REPLACEDREPLACEDREPLACED1234
