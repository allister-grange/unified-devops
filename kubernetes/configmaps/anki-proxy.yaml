apiVersion: v1
kind: ConfigMap
metadata:
  name: anki-proxy-config
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        # HTTP Basic Auth for every request except the health endpoint.
        auth_basic           "Anki";
        auth_basic_user_file /etc/nginx/auth/.htpasswd;

        # Unauthenticated liveness/readiness endpoint for the kubelet probe
        # (probes get a 401 otherwise, so they can't use "/").
        location = /healthz {
            auth_basic off;
            access_log off;
            return 200 "ok\n";
        }

        # Media attached via addNote is base64-encoded in the JSON body.
        client_max_body_size 25m;

        # AnkiConnect HTTP API on the Anki pod (ClusterIP, not publicly exposed).
        location / {
            proxy_pass http://anki-service:8765;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # sync() and media transfers can be slow.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
